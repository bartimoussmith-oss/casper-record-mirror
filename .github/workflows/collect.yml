name: Archive Casper WY documents
true: &id001
  workflow_dispatch:
    inputs:
      max_new:
        description: Stop after archiving N new documents (0 = no count cap; e.g.
          5 for bounded verification)
        required: false
        default: '0'
      max_seconds:
        description: Graceful runtime budget in seconds (default 2700 = 45 minutes)
        required: false
        default: '2700'
      source:
        description: Collection source (wayback or live)
        required: false
        default: wayback
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Download documents
      id: download
      env:
        INPUT_MAX_NEW: ${{ inputs.max_new || '0' }}
        INPUT_MAX_SECONDS: ${{ inputs.max_seconds || '2700' }}
      run: 'case "$INPUT_MAX_NEW" in ''''|*[!0-9]*) echo "Invalid max_new: $INPUT_MAX_NEW";
        exit 1 ;; esac

        case "$INPUT_MAX_SECONDS" in ''''|*[!0-9]*) echo "Invalid max_seconds: $INPUT_MAX_SECONDS";
        exit 1 ;; esac

        python3 collect.py --delay 3.0 --max-new "$INPUT_MAX_NEW" --max-seconds "$INPUT_MAX_SECONDS"

        '
    - name: Commit the archive
      run: "set -e\ngit config user.name \"casper-record-mirror[bot]\"\ngit config\
        \ user.email \"github-actions[bot]@users.noreply.github.com\"\nif [ -d documents\
        \ ]; then\n  git add documents\nfi\nif [ -f manifest.json ]; then\n  git add\
        \ manifest.json\nfi\nif [ -f MANIFEST.md ]; then\n  git add MANIFEST.md\n\
        fi\nif [ -z \"$(git status --porcelain)\" ]; then\n  echo \"Nothing to add\
        \ \u2014 archive is current.\"\n  exit 0\nfi\ngit commit -m \"Archive casperwy.gov\
        \ documents (${{ github.run_number }})\"\ngit push\n"
'on': *id001
